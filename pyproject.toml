[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymsafety"
version = "0.1.0"
description = "Asymptotic Safety in quantum gravity: FRG beta functions, fixed points, and RG flows"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.12",
    # Pinned upper bound: hash-regression baselines in tests/baselines/
    # are matplotlib-version-sensitive. Refresh with
    # `python scripts/generate_figures.py --update-baselines` when
    # bumping the upper bound.
    "matplotlib>=3.8,<3.10",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
gpu = [
    "jax[cpu]>=0.4",
]
distributed = [
    "ray[default]>=2.9",
]
dask = [
    "dask[distributed]>=2024.1",
]
cloud = [
    "ray[default]>=2.9",
    "docker>=7.0",
]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
]
cache = [
    "joblib>=1.3",
]
hdf5 = [
    "h5py>=3.10",
]
notebooks = [
    "jupyter>=1.0",
    "nbmake>=1.5",
]
animations = [
    # PillowWriter ships with matplotlib but Pillow itself is the encoder
    # for the .gif fallback. FFMpegWriter (.mp4) needs system ffmpeg
    # and is not added here as a Python dependency.
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout",
    "hypothesis",
    "joblib>=1.3",
]

[project.scripts]
asymsafety-gui = "asymsafety.gui:launch_gui"
asymsafety = "asymsafety.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
