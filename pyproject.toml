[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymsafety"
version = "0.1.0"
description = "Asymptotic Safety in quantum gravity: FRG beta functions, fixed points, and RG flows"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
gpu = [
    "jax[cpu]>=0.4",
]
distributed = [
    "ray[default]>=2.9",
]
dask = [
    "dask[distributed]>=2024.1",
]
cloud = [
    "ray[default]>=2.9",
    "docker>=7.0",
]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout",
    "hypothesis",
]

[project.scripts]
asymsafety-gui = "asymsafety.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
